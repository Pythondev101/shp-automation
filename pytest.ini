[pytest]
# Run pytest from the project root: the relative output paths below resolve from there.
testpaths = tests
pythonpath = .
# Unregistered markers, unknown ini keys, passing xfails and duplicate parametrize ids fail the run.
strict = true

addopts =
    -ra
    --import-mode=importlib
    --screenshot=only-on-failure
    --full-page-screenshot
    --tracing=retain-on-failure
    --output=test-results
    --junitxml=reports/junit.xml

markers =
    smoke: critical checks that the application is up and usable
    sanity: quick focused checks of one area after a change
    regression: broad behavioural coverage, run before releases
    functional: verifies a feature against its expected behaviour
    api: exercises the backend API directly, without a browser
    integration: validates behaviour across layers (UI / API / DB)
    e2e: complete user workflow from start to finish
    authentication: login, logout and session handling
    permissions: role and access-control rules
    destructive: writes application data (create / edit / delete) and cleans it up again
    shared_state: changes a setting of the shared automation account (profile, password, plan) and restores it; never run two of these at the same time

log_file = reports/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)-8s %(name)s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
