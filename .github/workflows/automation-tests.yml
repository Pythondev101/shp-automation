name: Automation tests

# Everything runs automatically. The suite targets the LIVE SHP application with one
# shared automation account, so the pipeline is ordered so that no two jobs change the
# account at the same time:
#   setup (reachability) -> read-only tests (cross-browser) -> data-writing tests (chromium only) -> result
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    # Nightly regression, 01:30 UTC
    - cron: "30 1 * * *"
  workflow_dispatch:

# One live account: two runs must never change it at the same time. Queued, not cancelled,
# so a run that is already restoring the account is always allowed to finish.
concurrency:
  group: shp-live-automation
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  setup:
    name: Setup and reachability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      browsers: ${{ steps.scope.outputs.browsers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate the pytest configuration and collect the suite
        run: python -m pytest --collect-only -q

      - name: Verify the SHP site is reachable
        env:
          SHP_BASE_URL: ${{ secrets.SHP_BASE_URL }}
        run: |
          if [ -z "$SHP_BASE_URL" ]; then
            echo "::error::Secret SHP_BASE_URL is not configured for this repository."
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 5 "${SHP_BASE_URL%/}/login" || echo 000)
          echo "Reachability check returned HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "::error::The SHP site did not answer with a success status (HTTP $status)."
            exit 1
          fi

      - name: Decide the browser scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" = "refs/heads/development" ]; then
            echo 'browsers=["chromium"]' >> "$GITHUB_OUTPUT"
          else
            echo 'browsers=["chromium","firefox","webkit"]' >> "$GITHUB_OUTPUT"
          fi

  read_only:
    name: Read-only tests (${{ matrix.browser }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.setup.outputs.browsers) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browser and Linux dependencies
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      # The two Training Video playback tests run in the video_playback job instead:
      # YouTube answers GitHub-hosted runner IPs with "Sign in to confirm you're not a bot".
      - name: Run the tests that change no data
        env:
          SHP_BASE_URL: ${{ secrets.SHP_BASE_URL }}
          SHP_USERNAME: ${{ secrets.SHP_USERNAME }}
          SHP_PASSWORD: ${{ secrets.SHP_PASSWORD }}
        run: >
          python -m pytest -m "not destructive"
          --deselect tests/ui/test_training_videos.py::test_selected_video_starts_playing
          --deselect tests/ui/test_training_videos.py::test_only_one_video_plays_at_a_time
          --browser ${{ matrix.browser }}
          --video retain-on-failure

      - name: Upload reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: read-only-${{ matrix.browser }}
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  video_playback:
    name: Training Video playback (${{ matrix.browser }}, self-hosted)
    # YouTube serves the embedded videos only to a network it does not flag as a bot,
    # so these two tests need a self-hosted runner (repo Settings -> Actions -> Runners).
    # Read-only: they may run beside the read_only jobs.
    needs: setup
    runs-on: self-hosted
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        browser: ${{ fromJSON(needs.setup.outputs.browsers) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install ${{ matrix.browser }}

      - name: Run the Training Video playback tests
        env:
          SHP_BASE_URL: ${{ secrets.SHP_BASE_URL }}
          SHP_USERNAME: ${{ secrets.SHP_USERNAME }}
          SHP_PASSWORD: ${{ secrets.SHP_PASSWORD }}
        run: >
          python -m pytest
          tests/ui/test_training_videos.py::test_selected_video_starts_playing
          tests/ui/test_training_videos.py::test_only_one_video_plays_at_a_time
          --browser ${{ matrix.browser }}
          --video retain-on-failure

      - name: Upload reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: video-playback-${{ matrix.browser }}
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  data_writing:
    name: Data-writing tests (chromium)
    # Runs after every read-only job, never beside one: these tests change the shared
    # account (password, plan, profile) and create and delete channels and cases.
    needs: [setup, read_only]
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browser and Linux dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run the create / edit / delete and account-state tests
        env:
          SHP_BASE_URL: ${{ secrets.SHP_BASE_URL }}
          SHP_USERNAME: ${{ secrets.SHP_USERNAME }}
          SHP_PASSWORD: ${{ secrets.SHP_PASSWORD }}
        run: >
          python -m pytest -m destructive
          --browser chromium
          --video retain-on-failure

      - name: Upload reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: data-writing-chromium
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  result:
    name: Result
    needs: [setup, read_only, video_playback, data_writing]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report PASS / FAIL
        env:
          SETUP: ${{ needs.setup.result }}
          READ_ONLY: ${{ needs.read_only.result }}
          VIDEO_PLAYBACK: ${{ needs.video_playback.result }}
          DATA_WRITING: ${{ needs.data_writing.result }}
        run: |
          {
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Setup and reachability | $SETUP |"
            echo "| Read-only tests | $READ_ONLY |"
            echo "| Training Video playback (self-hosted) | $VIDEO_PLAYBACK |"
            echo "| Data-writing tests | $DATA_WRITING |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$SETUP" = "success" ] && [ "$READ_ONLY" = "success" ] && [ "$VIDEO_PLAYBACK" = "success" ] && [ "$DATA_WRITING" = "success" ]; then
            echo "PASS ✅ - every configured test passed and the account state was restored." >> "$GITHUB_STEP_SUMMARY"
            echo "PASS ✅"
          else
            echo "FAIL ❌ - see the job logs and the uploaded artifacts (screenshots, traces, videos, logs, JUnit report)." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::FAIL - at least one stage did not pass. A failed teardown means automation data may be left in the account; check the log for 'Clean-up failed', 'PASSWORD NOT RESTORED' or 'RESTORE FAILED'."
            exit 1
          fi
